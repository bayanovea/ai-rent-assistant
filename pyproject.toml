[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rent-assistant"
version = "0.2.0"
description = "Scrapes long-term rental ads into a local database, has Claude Code read them against one requirements letter, and exports a scored, filterable HTML table"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "bayanovea", email = "bayanovea@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "click>=8.1",
    "python-dateutil>=2.9",
    "pillow>=10",
]

[project.urls]
Repository = "https://github.com/bayanovea/ai-rent-assistant"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
rent-assistant = "rent_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
