<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1184" width="820" height="1184" role="img" aria-label="The rent-assistant pipeline in five stages: collect, read the text, cut what is wrong, look at the photos, shortlist" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>The rent-assistant pipeline, five stages top to bottom</title>
<rect width="820" height="1184" fill="#ffffff"/>
<text x="78" y="34" font-size="16" font-weight="600" fill="#1a1d21">From a Facebook card to a phone call</text>
<text x="78" y="54" font-size="12" fill="#6b7280">Each stage runs on what the one above it left. Nothing here loops back.</text>
<rect x="738" y="26" width="10" height="10" rx="2.5" fill="#C0771B"/>
<text x="754" y="35" font-size="11.5" fill="#4b5563">you</text>
<rect x="673" y="26" width="10" height="10" rx="2.5" fill="#7A4FB6"/>
<text x="689" y="35" font-size="11.5" fill="#4b5563">Claude</text>
<rect x="600" y="26" width="10" height="10" rx="2.5" fill="#2F6F9F"/>
<text x="616" y="35" font-size="11.5" fill="#4b5563">machine</text>
<line x1="40" y1="108" x2="40" y2="996" stroke="#d7dbe0" stroke-width="2"/>
<!-- stage 1: Collect and merge -->
<rect x="78" y="78" width="24" height="156" rx="10" fill="#2F6F9F"/>
<rect x="84" y="78" width="700" height="156" rx="10" fill="#ffffff" stroke="#e3e6ea"/>
<circle cx="40" cy="108" r="17" fill="#2F6F9F"/>
<text x="40" y="114" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<polyline points="106,96 111,101 106,106" stroke="#2F6F9F" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="113" y1="106" x2="118" y2="106" stroke="#2F6F9F" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="130" y="106" font-size="10.5" font-weight="700" letter-spacing="0.09em" fill="#2F6F9F">CLI · PLAYWRIGHT</text>
<text x="104" y="136" font-size="16.5" font-weight="600" fill="#1a1d21">Collect and merge</text>
<text x="104" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#374151">rent-assistant scrape --bands 4 --no-photos</text>
<text x="104" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#374151">rent-assistant dedupe</text>
<text x="104" y="206" font-size="12.5" fill="#4b5563"><tspan fill="#2F6F9F" font-weight="700">→ </tspan>listings, gallery links, photo hashes</text>
<text x="104" y="225" font-size="11.5" fill="#8b93a1">The only stage that talks to Facebook.</text>
<line x1="90" y1="246" x2="90" y2="284" stroke="#b6bcc5" stroke-width="1.5"/>
<polygon points="86,280 94,280 90,289" fill="#b6bcc5"/>
<text x="106" y="271" font-size="12" fill="#6b7280" font-style="italic">raw ad text</text>
<!-- stage 2: Read the text -->
<rect x="78" y="300" width="24" height="156" rx="10" fill="#7A4FB6"/>
<rect x="84" y="300" width="700" height="156" rx="10" fill="#ffffff" stroke="#e3e6ea"/>
<circle cx="40" cy="330" r="17" fill="#7A4FB6"/>
<text x="40" y="336" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<line x1="112" y1="316" x2="112" y2="330" stroke="#7A4FB6" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="105" y1="323" x2="119" y2="323" stroke="#7A4FB6" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="107.4" y1="318.4" x2="116.6" y2="327.6" stroke="#7A4FB6" stroke-width="1.15" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="107.4" y1="327.6" x2="116.6" y2="318.4" stroke="#7A4FB6" stroke-width="1.15" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="130" y="328" font-size="10.5" font-weight="700" letter-spacing="0.09em" fill="#7A4FB6">SKILL  /ANALYZE  ·  OPUS</text>
<text x="104" y="358" font-size="16.5" font-weight="600" fill="#1a1d21">Read the text</text>
<text x="104" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#374151">rent-assistant ai-batch    →  Claude reads the ads</text>
<text x="104" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#374151">rent-assistant ai-apply    →  rules.py decides</text>
<text x="104" y="428" font-size="12.5" fill="#4b5563"><tspan fill="#7A4FB6" font-weight="700">→ </tspan>filled columns, one-line verdict, auto-rejections</text>
<text x="104" y="447" font-size="11.5" fill="#8b93a1">Never touches Facebook, so it can run while a scrape does.</text>
<line x1="90" y1="468" x2="90" y2="506" stroke="#b6bcc5" stroke-width="1.5"/>
<polygon points="86,502 94,502 90,511" fill="#b6bcc5"/>
<text x="106" y="493" font-size="12" fill="#6b7280" font-style="italic">a scored table</text>
<!-- stage 3: Cut what is obviously wrong -->
<rect x="78" y="522" width="24" height="156" rx="10" fill="#C0771B"/>
<rect x="84" y="522" width="700" height="156" rx="10" fill="#ffffff" stroke="#e3e6ea"/>
<circle cx="40" cy="552" r="17" fill="#C0771B"/>
<text x="40" y="558" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<circle cx="112" cy="542" r="3.1" stroke="#C0771B" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 106 551.5 a 6 5.5 0 0 1 12 0" stroke="#C0771B" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="130" y="550" font-size="10.5" font-weight="700" letter-spacing="0.09em" fill="#C0771B">YOU</text>
<text x="104" y="580" font-size="16.5" font-weight="600" fill="#1a1d21">Cut what is obviously wrong</text>
<text x="104" y="606" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#374151">rent-assistant rate &lt;id&gt; 1–5</text>
<text x="104" y="626" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#374151">rent-assistant reject &lt;id&gt; --reason &quot;…&quot;</text>
<text x="104" y="650" font-size="12.5" fill="#4b5563"><tspan fill="#C0771B" font-weight="700">→ </tspan>decisions.json — your word beats the rules</text>
<text x="104" y="669" font-size="11.5" fill="#8b93a1">Every rejection here is a gallery not downloaded and tokens not spent.</text>
<line x1="90" y1="690" x2="90" y2="728" stroke="#b6bcc5" stroke-width="1.5"/>
<polygon points="86,724 94,724 90,733" fill="#b6bcc5"/>
<text x="106" y="715" font-size="12" fill="#6b7280" font-style="italic">the survivors, and only them</text>
<!-- stage 4: Look at the photos -->
<rect x="78" y="744" width="24" height="156" rx="10" fill="#7A4FB6"/>
<rect x="84" y="744" width="700" height="156" rx="10" fill="#ffffff" stroke="#e3e6ea"/>
<circle cx="40" cy="774" r="17" fill="#7A4FB6"/>
<text x="40" y="780" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<line x1="112" y1="760" x2="112" y2="774" stroke="#7A4FB6" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="105" y1="767" x2="119" y2="767" stroke="#7A4FB6" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="107.4" y1="762.4" x2="116.6" y2="771.6" stroke="#7A4FB6" stroke-width="1.15" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="107.4" y1="771.6" x2="116.6" y2="762.4" stroke="#7A4FB6" stroke-width="1.15" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="130" y="772" font-size="10.5" font-weight="700" letter-spacing="0.09em" fill="#7A4FB6">SKILL  /PHOTO-ANALYZE  ·  SONNET SUBAGENTS</text>
<text x="104" y="802" font-size="16.5" font-weight="600" fill="#1a1d21">Look at the photos</text>
<text x="104" y="828" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#374151">rent-assistant photos-fetch  →  photo-batch</text>
<text x="104" y="848" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#374151">one subagent per listing  →  rent-assistant photo-apply</text>
<text x="104" y="872" font-size="12.5" fill="#4b5563"><tspan fill="#7A4FB6" font-weight="700">→ </tspan>disagreements with the text, score recomputed</text>
<text x="104" y="891" font-size="11.5" fill="#8b93a1">Runs only when you ask for it — never on its own.</text>
<line x1="90" y1="912" x2="90" y2="950" stroke="#b6bcc5" stroke-width="1.5"/>
<polygon points="86,946 94,946 90,955" fill="#b6bcc5"/>
<text x="106" y="937" font-size="12" fill="#6b7280" font-style="italic">where the pictures contradict the ad</text>
<!-- stage 5: Shortlist and write -->
<rect x="78" y="966" width="24" height="156" rx="10" fill="#C0771B"/>
<rect x="84" y="966" width="700" height="156" rx="10" fill="#ffffff" stroke="#e3e6ea"/>
<circle cx="40" cy="996" r="17" fill="#C0771B"/>
<text x="40" y="1002" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<circle cx="112" cy="986" r="3.1" stroke="#C0771B" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 106 995.5 a 6 5.5 0 0 1 12 0" stroke="#C0771B" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="130" y="994" font-size="10.5" font-weight="700" letter-spacing="0.09em" fill="#C0771B">YOU</text>
<text x="104" y="1024" font-size="16.5" font-weight="600" fill="#1a1d21">Shortlist and write</text>
<text x="104" y="1050" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#374151">rent-assistant shortlist &lt;id&gt; --reason &quot;…&quot;</text>
<text x="104" y="1094" font-size="12.5" fill="#4b5563"><tspan fill="#C0771B" font-weight="700">→ </tspan>the Shortlist tab in rentals.html</text>
<text x="104" y="1113" font-size="11.5" fill="#8b93a1">The only output that leaves the machine: a message to an agent.</text>
<text x="78" y="1156" font-size="11.5" fill="#8b93a1">rent-assistant export refreshes rentals.csv and rentals.html after any stage — it only reads.</text>
</svg>
